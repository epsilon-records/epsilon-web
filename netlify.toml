# epsilon-web is a static site: there is no build step. Netlify publishes public/ as-is.
# Redirects, headers and the publish directory live here (planned in knowledge issue #31).

[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# --- Decided redirects (knowledge issue #31, section 1) ---------------------
# The old home URL, and the extension-less about/contact URLs, once
# epsilonrecords.com points at this site.

[[redirects]]
  from = "/epsilon-records"
  to = "/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

