# epsilon-web is a static site: there is no build step. Netlify publishes public/ as-is.
# Redirects, headers and the publish directory live here.
#
# The redirect map is decided in epsilon-web decisions 0003 and 0005
# (knowledge/epsilon-web/decisions/0003-migration-redirects-host-and-dns.md,
# 0005-include-anr-guide.md) and the URL inventory in knowledge issue #31.
# Do not add destinations that are not decided there.

[build]
  publish = "public"
  # storybook-hub/ is a different Netlify site (shared 0066). Commits that only touch it skip this
  # site's deploy (15 Free-plan credits each); an uncached build (equal refs) always deploys.
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)storybook-hub'"

# The Content-Security-Policy allows what the pages load (EPSILON-118): self-hosted fonts, the
# Cloudflare Web Analytics beacon (shared 0011) and the Kit signup form's POST (shared 0027),
# whose redirect returns to epsilonrecords.com ('self'). The pages carry no inline scripts or styles;
# scripts/check.mjs fails if one appears. JSON-LD blocks are data, not scripts, so CSP ignores them.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self' https://cloudflareinsights.com; form-action 'self' https://app.kit.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The stylesheet's URL never changes, so a max-age let returning visitors pair new
# HTML with up to an hour-old CSS after a deploy (seen on epsilon-web#18). Revalidate
# every time instead: Netlify answers with its ETag, so an unchanged file costs a 304.
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# --- Canonical host (0003) --------------------------------------------------
# The apex is canonical; www 301s to it. Live since the 2026-11-08 cutover.

[[redirects]]
  from = "https://www.epsilonrecords.com/*"
  to = "https://epsilonrecords.com/:splat"
  status = 301
  force = true

# The .nl domain keeps serving as a 301 to .com — not retired, not parallel (0003).

[[redirects]]
  from = "https://epsilonrecords.nl/*"
  to = "https://epsilonrecords.com/:splat"
  status = 301
  force = true

# --- Old URLs on the new host (0003, #31 section 1) -------------------------

# The old home URL, and the extension-less about/contact URLs.

[[redirects]]
  from = "/epsilon-records"
  to = "/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

# Label/collective pages kept as pages (0003), plus the A&R guide kept as a page
# (0005): the extension-less old URLs 301 to them.

[[redirects]]
  from = "/nieuwe-groove-collectief"
  to = "/nieuwe-groove-collectief/"
  status = 301

[[redirects]]
  from = "/diverse-records"
  to = "/diverse-records/"
  status = 301

[[redirects]]
  from = "/collective"
  to = "/collective/"
  status = 301

[[redirects]]
  from = "/partners"
  to = "/partners/"
  status = 301

[[redirects]]
  from = "/anr-guide"
  to = "/anr-guide/"
  status = 301

# The shop is gone: /merch and its ~38 product URLs 301 to the external store (0003).

[[redirects]]
  from = "/merch"
  to = "https://epsilonrecords.bandcamp.com"
  status = 301
  force = true

[[redirects]]
  from = "/merch/*"
  to = "https://epsilonrecords.bandcamp.com"
  status = 301
  force = true

# Membership, onboarding, cart and accounts are dropped (0003): 410 Gone, not a
# redirect, so search engines drop them instead of following them somewhere else.

[[redirects]]
  from = "/join"
  to = "/"
  status = 410

[[redirects]]
  from = "/onboarding"
  to = "/"
  status = 410

[[redirects]]
  from = "/cart"
  to = "/"
  status = 410

[[redirects]]
  from = "/account/*"
  to = "/"
  status = 410

