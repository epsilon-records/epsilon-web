# epsilon-web is a static site: there is no build step. Netlify publishes public/ as-is.
# Redirects, headers and the publish directory live here.
#
# The redirect map is decided in epsilon-web decision 0003
# (knowledge/epsilon-web/decisions/0003-migration-redirects-host-and-dns.md) and the
# URL inventory in knowledge issue #31. Do not add destinations that are not in 0003.

[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# --- Canonical host (0003) --------------------------------------------------
# The apex is canonical; www 301s to it. Inert until the domain is attached to
# this Netlify site — the cutover itself is still deferred.

[[redirects]]
  from = "https://www.epsilonrecords.com/*"
  to = "https://epsilonrecords.com/:splat"
  status = 301
  force = true

# The .nl domain keeps serving as a 301 to .com — not retired, not parallel (0003).

[[redirects]]
  from = "https://epsilonrecords.nl/*"
  to = "https://epsilonrecords.com/:splat"
  status = 301
  force = true

# --- Old URLs on the new host (0003, #31 section 1) -------------------------

# The old home URL, and the extension-less about/contact URLs.

[[redirects]]
  from = "/epsilon-records"
  to = "/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

# The shop is gone: /merch and its ~38 product URLs 301 to the external store (0003).

[[redirects]]
  from = "/merch"
  to = "https://epsilonrecords.bandcamp.com"
  status = 301
  force = true

[[redirects]]
  from = "/merch/*"
  to = "https://epsilonrecords.bandcamp.com"
  status = 301
  force = true

# Membership, onboarding, cart and accounts are dropped (0003): 410 Gone, not a
# redirect, so search engines drop them instead of following them somewhere else.

[[redirects]]
  from = "/join"
  to = "/"
  status = 410

[[redirects]]
  from = "/onboarding"
  to = "/"
  status = 410

[[redirects]]
  from = "/cart"
  to = "/"
  status = 410

[[redirects]]
  from = "/account/*"
  to = "/"
  status = 410

# --- Not implemented on purpose --------------------------------------------
# - Label/collective pages (/nieuwe-groove-collectief, /diverse-records,
#   /collective, /partners, /anr-guide): 0003 keeps them as label pages, so they
#   are content to migrate, not redirects. They 404 until those pages land.
# - Analytics: none (0003).
# - DNS and the Netlify domain attachment: deferred by Nate (0003).
