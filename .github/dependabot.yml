version: 2
updates:
  - package-ecosystem: npm
    directory: "/storybook-hub"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 2
    groups:
      # One PR a month for minor and patch updates; majors come as a second grouped PR.
      all-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major-updates:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 2
    groups:
      # One PR a month for minor and patch updates; majors come as a second grouped PR.
      all-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major-updates:
        patterns: ["*"]
        update-types: ["major"]
