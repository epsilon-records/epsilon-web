name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repo. Netlify deploys through its GitHub link (epsilon-web 0013).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Dependency-free: checks links, page metadata and sitemap coverage. No npm install.
      - run: node scripts/check.mjs
      # Release check: fails while any data-required fact (the privacy notice's controller and contact)
      # is unfilled, so a page that needs one can't merge to main, which Netlify deploys.
      - run: node scripts/check.mjs --release
