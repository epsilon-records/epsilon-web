name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Dependency-free: checks links, page metadata and sitemap coverage. No npm install.
      - run: node scripts/check.mjs

  # Netlify Free cannot continuous-deploy private org repos
  # (deploy_private_corp_repos=false → "Unsupported repository type").
  # Publish via the CLI instead; keeps the repo private (decision 0002 / 0006).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Release gate: fails while any data-required fact (e.g. the privacy
      # notice's controller and contact) is unfilled, so it is never published.
      - run: node scripts/check.mjs --release
      - run: npm install --global netlify-cli@17
      - name: Deploy production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: netlify deploy --prod --dir=public --message "github ${{ github.sha }}"
